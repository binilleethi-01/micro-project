
<!DOCTYPE html>
<html>
<head>
    <title>StudyMate - Student Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>StudyMate</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Register</a>

            <!-- Dark / Light Mode Button -->
            <button id="themeToggle" type="button">🌙</button>
        </div>
    </nav>

    <!-- Landing Page -->
    <section class="hero">

        <h1 id="welcome">Welcome to StudyMate!</h1>

        <h3>Your Smart Academic Study Planner</h3>

        <p>
            Organize your studies, manage assignments,
            plan your timetable and achieve your academic goals.
        </p>

        <a href="signup.html" class="btn">Get Started</a>

        <a href="login.html" class="btn login-btn">Login</a>

    </section>

    <!-- Dark / Light Mode JavaScript -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const themeToggle = document.getElementById("themeToggle");

        const savedTheme = localStorage.getItem("theme") || "light";

        document.body.classList.toggle(
            "dark-mode",
            savedTheme === "dark"
        );

        themeToggle.textContent =
            savedTheme === "dark" ? "☀️" : "🌙";

        themeToggle.addEventListener("click", function () {

            const isDark = document.body.classList.toggle("dark-mode");

            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );

            themeToggle.textContent = isDark ? "☀️" : "🌙";

        });

    });
    </script>

</body>
</html>
