
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate - Study Planner</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* LIGHT MODE */
        body {
            background: linear-gradient(135deg, #dbeafe, #e9d5ff, #fce7f3);
            color: #222;
            transition: background 0.3s, color 0.3s;
        }

        /* DARK MODE */
        body.dark-mode {
            background: #121212;
            color: white;
        }

        body.dark-mode nav {
            background: #1f1f1f;
            color: white;
        }

        body.dark-mode nav a,
        body.dark-mode nav h2 {
            color: white;
        }

        body.dark-mode .planner-container {
            background: #252525;
            color: white;
        }

        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode p,
        body.dark-mode label {
            color: white;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #333;
            color: white;
            border: 1px solid #666;
        }

        body.dark-mode .schedule-item {
            background: #333;
            color: white;
        }

        /* THEME BUTTON */
        #themeToggle {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        /* TIME INPUT */
        .time-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-input input {
            width: 90px;
        }

        .time-input select {
            padding: 10px;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 600px) {
            .time-input {
                flex-wrap: wrap;
            }

            nav {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>

        <h2>StudyMate</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
            <a href="#" id="logout">Logout</a>

            <button type="button" id="themeToggle">
                🌙 Dark Mode
            </button>
        </div>

    </nav>

    <!-- Study Planner -->
    <main class="planner-container">

        <h1>My Study Planner 📚</h1>

        <p>Organize your daily study schedule.</p>

        <!-- Planner Form -->
        <form id="plannerForm">

            <label for="subject">Subject Name</label>

            <input
                type="text"
                id="subject"
                placeholder="Enter subject name"
                required
            >

            <label for="topic">Study Topic</label>

            <input
                type="text"
                id="topic"
                placeholder="Enter study topic"
                required
            >

            <label for="studyDate">Study Date</label>

            <input
                type="date"
                id="studyDate"
                required
            >

            <label>Study Time</label>

            <div class="time-input">

                <input
                    type="number"
                    id="studyHour"
                    placeholder="Hour"
                    min="1"
                    max="12"
                    required
                >

                <span>:</span>

                <input
                    type="number"
                    id="studyMinute"
                    placeholder="Minute"
                    min="0"
                    max="59"
                    required
                >

                <select id="studyPeriod" required>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>

            </div>

            <button type="submit">
                Add Study Schedule
            </button>

        </form>

        <!-- Schedule List -->
        <h2>My Study Schedule</h2>

        <div id="scheduleList"></div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 StudyMate | Study Planner</p>
    </footer>

    <!-- Shared JavaScript -->
    <script src="script.js"></script>

    <!-- Light and Dark Mode -->
    <script>


        const savedTheme = localStorage.getItem("theme") || "light";

        document.body.classList.toggle(
            "dark-mode",
            savedTheme === "dark"
        );

        function updateThemeButton() {

            if (document.body.classList.contains("dark-mode")) {
                themeButton.textContent = "☀️ Light Mode";
            } else {
                themeButton.textContent = "🌙 Dark Mode";
            }

        }

        updateThemeButton();

        themeButton.addEventListener("click", function() {

            document.body.classList.toggle("dark-mode");

            const currentTheme =
                document.body.classList.contains("dark-mode")
                    ? "dark"
                    : "light";

            localStorage.setItem("theme", currentTheme);

            updateThemeButton();

        });

    </script>

</body>
</html>
