
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager - StudyMate</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* LIGHT MODE */
        body {
            background: linear-gradient(135deg, #dbeafe, #e9d5ff, #fce7f3);
            color: #222;
            transition: background 0.3s, color 0.3s;
        }

        /* DARK MODE */
        body.dark-mode {
            background: #121212;
            color: white;
        }

        body.dark-mode nav {
            background: #1f1f1f;
            color: white;
        }

        body.dark-mode nav h2,
        body.dark-mode nav a {
            color: white;
        }

        body.dark-mode .planner-container {
            background: #252525;
            color: white;
        }

        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode h3,
        body.dark-mode p,
        body.dark-mode label {
            color: white;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #333;
            color: white;
            border: 1px solid #666;
        }

        body.dark-mode .task-item {
            background: #333;
            color: white;
        }

        /* THEME BUTTON */
        #themeToggle {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #themeToggle:hover {
            background: #1d4ed8;
        }

        /* TASK ITEMS */
        .task-item {
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .completed-task {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 600px) {

            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            .planner-container {
                width: 95%;
                padding: 15px;
            }

        }

    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>

        <h2>StudyMate</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="planner.html">Study Planner</a>
            <a href="index.html">Home</a>
            <a href="#" id="logout">Logout</a>

            <button type="button" id="themeToggle">
                🌙 Dark Mode
            </button>
        </div>

    </nav>

    <!-- Task Manager -->
    <main class="planner-container">

        <h1>My Task Manager 📝</h1>

        <p>Manage your assignments and academic tasks.</p>

        <!-- Task Form -->
        <form id="taskForm">

            <label for="taskTitle">Task Title</label>

            <input
                type="text"
                id="taskTitle"
                placeholder="Enter task title"
                required
            >

            <label for="taskSubject">Subject</label>

            <input
                type="text"
                id="taskSubject"
                placeholder="Enter subject name"
                required
            >

            <label for="taskDate">Due Date</label>

            <input
                type="date"
                id="taskDate"
                required
            >

            <label for="taskPriority">Priority</label>

            <select id="taskPriority" required>

                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>

            </select>

            <button type="submit">
                Add Task
            </button>

        </form>

        <!-- Task List -->
        <h2>My Tasks</h2>

        <div id="taskList"></div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 StudyMate | Task Management System</p>
    </footer>

    <!-- Existing JavaScript -->
    <script src="script.js"></script>

    <!-- Light and Dark Mode -->
    <script>


        // Get saved theme
        const savedTheme = localStorage.getItem("theme") || "light";

        // Apply saved theme
        document.body.classList.toggle(
            "dark-mode",
            savedTheme === "dark"
        );

        // Update button text
        function updateThemeButton() {

            if (document.body.classList.contains("dark-mode")) {
                themeButton.textContent = "☀️ Light Mode";
            } else {
                themeButton.textContent = "🌙 Dark Mode";
            }

        }

        updateThemeButton();

        // Change theme
        themeButton.addEventListener("click", function() {

            document.body.classList.toggle("dark-mode");

            const currentTheme =
                document.body.classList.contains("dark-mode")
                    ? "dark"
                    : "light";

            localStorage.setItem("theme", currentTheme);

            updateThemeButton();

        });

    </script>

</body>
</html>
